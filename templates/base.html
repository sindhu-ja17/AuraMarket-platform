<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AuraMarket - AI-Powered Marketplace{% endblock %}</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Feather Icons -->
    <script src="https://unpkg.com/feather-icons"></script>
    
    <!-- Styling -->
    <link rel="stylesheet" href="/static/css/style.css?v=2">
    
    <!-- Chart.js (used in Analytics) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    {% block head %}{% endblock %}
</head>
<body>
    <!-- Toast notifications -->
    <div id="toast-container" style="position: fixed; top: 20px; right: 20px; z-index: 9999;"></div>

    <header class="glass-nav">
        <div class="container nav-container">
            <a href="/" class="logo">
                <i data-feather="zap"></i> AuraMarket
            </a>
            
            <div class="nav-links">
                <a href="/" class="nav-link">Home</a>
                <a href="/dashboard" class="nav-link" title="Sellers Analytics & Moderation">Dashboard</a>
                
                {% if session.get('user_id') %}
                    <a href="/my_listings" class="nav-link">My Listings</a>
                    <a href="/wishlist" class="nav-link"><i data-feather="heart" style="width:18px; height:18px; vertical-align:middle;"></i> Wishlist</a>
                    <a href="/chat" class="nav-link" title="Inbox Messages">
                        <i data-feather="mail" style="width:18px; height:18px; vertical-align:middle;"></i> Chat
                    </a>
                    <span style="font-size:14px; font-weight:600; color:var(--accent-color);">
                        👤 {{ session.get('username') }}
                    </span>
                    <a href="/auth/logout" class="nav-link" style="color:var(--danger);">Logout</a>
                    <a href="/product/add" class="btn btn-primary">
                        <i data-feather="plus"></i> Sell
                    </a>
                {% else %}
                    <a href="/auth/login" class="nav-link">Login</a>
                    <a href="/auth/register" class="btn btn-secondary">Register</a>
                {% endif %}

                <button class="theme-toggle" title="Toggle theme">
                    <i data-feather="moon"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="container" style="margin-top: 30px;">
        {% block content %}{% endblock %}
    </main>

    <!-- Firebase Compat SDKs from CDN -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics-compat.js"></script>

    <!-- Custom Main JS -->
    <script src="/static/js/main.js"></script>

    <script>
        // Set up Feather icons
        feather.replace();

        // Set up user's Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyDLDXiGL5ncQJM7T5cgyaYKs9cRTHkx0Xo",
            authDomain: "olx-clone-marketplace-platform.firebaseapp.com",
            projectId: "olx-clone-marketplace-platform",
            storageBucket: "olx-clone-marketplace-platform.firebasestorage.app",
            messagingSenderId: "226754294154",
            appId: "1:226754294154:web:8aedaa282e32e4abbed873",
            measurementId: "G-1Y8N15JT9C"
        };

        // Initialize Firebase SDK
        initFirebase(firebaseConfig);

        // Flash message toasts
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, msg in messages %}
                    showToast("{{ msg }}", "{{ 'success' if category == 'success' else 'danger' if category == 'error' else 'info' }}");
                {% endfor %}
            {% endif %}
        {% endwith %}
    </script>
    
    <script>
        async function toggleWishlist(event, productId, btnElement) {
            event.preventDefault();
            event.stopPropagation();
            
            try {
                const response = await fetch('/api/wishlist/toggle', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ product_id: productId })
                });
                
                if (response.status === 401) {
                    const data = await response.json();
                    window.location.href = data.redirect;
                    return;
                }
                
                if (response.ok) {
                    const data = await response.json();
                    if (data.status === 'added') {
                        btnElement.classList.add('liked');
                    } else if (data.status === 'removed') {
                        btnElement.classList.remove('liked');
                        // If we are on the wishlist page, optionally remove the card
                        if (window.location.pathname === '/wishlist') {
                            const card = btnElement.closest('.product-card');
                            if (card) {
                                card.style.transition = 'opacity 0.3s';
                                card.style.opacity = '0';
                                setTimeout(() => card.remove(), 300);
                            }
                        }
                    }
                }
            } catch (err) {
                console.error("Error toggling wishlist:", err);
            }
        }
    </script>
    {% block scripts %}{% endblock %}

</body>
</html>
